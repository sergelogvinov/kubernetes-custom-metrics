---
# Source: kubernetes-custom-metrics/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-custom-metrics
  labels:
    helm.sh/chart: kubernetes-custom-metrics-0.0.4
    app.kubernetes.io/name: kubernetes-custom-metrics
    app.kubernetes.io/instance: kubernetes-custom-metrics
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-custom-metrics
      app.kubernetes.io/instance: kubernetes-custom-metrics
  template:
    metadata:
      annotations:
        checksum/config: 1d5f11a05e3ff66861c29dd81cfca8d72d3d3745eaec1d3cdbacd6d13ca1c265
      labels:
        helm.sh/chart: kubernetes-custom-metrics-0.0.4
        app.kubernetes.io/name: kubernetes-custom-metrics
        app.kubernetes.io/instance: kubernetes-custom-metrics
        app.kubernetes.io/version: "v0.2.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      enableServiceLinks: false
      serviceAccountName: kubernetes-custom-metrics
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsUser: 65532
      containers:
        - name: kubernetes-custom-metrics
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/sergelogvinov/kubernetes-custom-metrics:v0.2.0"
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            # - --cert-dir=/var/run/certs
            - --tls-cert-file=/var/run/certs/tls.crt
            - --tls-private-key-file=/var/run/certs/tls.key
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
          #
          #
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/custom-metrics
              readOnly: false
            - name: certs
              mountPath: /var/run/certs
              readOnly: false
            - name: tmpfs
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: config
          configMap:
            name: kubernetes-custom-metrics
        - name: certs
          secret:
            secretName: kubernetes-custom-metrics-tls
        - name: tmpfs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubernetes-custom-metrics
                    app.kubernetes.io/instance: kubernetes-custom-metrics
                namespaces:
                  - "kube-system"
                topologyKey: kubernetes.io/hostname
              weight: 1

