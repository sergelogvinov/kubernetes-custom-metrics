# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: kubernetes-custom-metrics

before:
  hooks:
    - go mod download

dist: bin
builds:
  - id: custom-metrics
    main: ./cmd/custom-metrics
    binary: custom-metrics
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
  - id: kubectl-ctop
    main: ./cmd/kubectl-ctop
    binary: kubectl-ctop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

snapshot:
  version_template: edge

changelog:
  disable: true

archives:
  - id: kubectl-ctop
    ids:
      - kubectl-ctop
    formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: kubectl-ctop
    ids:
      - kubectl-ctop
    description: CTop is a kubectl plugin for top-like monitoring of Kubernetes historical resource usage
    homepage: "https://github.com/sergelogvinov/{{ .ProjectName }}"
    license: Apache-2.0

    directory: Casks
    commit_author:
      name: sergelogvinov
      email: 5407715+sergelogvinov@users.noreply.github.com
    repository:
      owner: sergelogvinov
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TOKEN }}"

    # Bug in goreleaser v2.17.1?
    # https://goreleaser.com/customization/publish/homebrew_casks/ without #{arch}
    custom_block: |
      arch arm: "arm64", intel: "amd64"

    binaries:
      - kubectl-ctop
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kubectl-ctop_darwin_#{arch}"]
          end

dockers_v2:
  - id: custom-metrics
    flags:
      - --target=release
    images:
      - "ghcr.io/sergelogvinov/{{ .ProjectName }}"
    tags:
      - "{{ if not .IsSnapshot }}v{{.Version}}{{ else }}edge{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.licenses: "Apache-2.0"
      org.opencontainers.image.source: "https://github.com/sergelogvinov/{{ .ProjectName }}"
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      io.artifacthub.package.readme-url: "https://raw.githubusercontent.com/sergelogvinov/{{ .ProjectName }}/main/README.md"
      io.artifacthub.package.license: "Apache-2.0"

docker_signs:
  - id: custom-metrics
    cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    output: true

checksum:
  ids:
    - kubectl-ctop
  name_template: checksums.txt
  algorithm: sha256

signs:
  - artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true
