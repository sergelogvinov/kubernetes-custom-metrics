apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubernetes-custom-metrics.fullname" . }}
  labels:
    {{- include "kubernetes-custom-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ""
    resources:
    - nodes
    - namespaces
    - pods
    - services
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - apps
    resources:
    - daemonsets
    - deployments
    - statefulsets
    verbs:
    - get
    - list
  - apiGroups:
    - batch
    resources:
    - cronjobs
    - jobs
    verbs:
    - get
    - list
